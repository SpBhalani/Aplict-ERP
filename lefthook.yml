# Commit guards (gate 3). Installed automatically by `pnpm install`.
pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx,mjs}'
      run: pnpm exec eslint --max-warnings=0 {staged_files}
    format:
      glob: '*.{ts,tsx,mjs,json,md,yml,yaml}'
      run: pnpm exec prettier --check {staged_files}
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-push:
  commands:
    verify:
      run: pnpm -s verify:quick
