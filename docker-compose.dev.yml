# Local development services. Start with: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports: ['5432:5432']
    volumes: [pg_data:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ['6379:6379']
volumes:
  pg_data: {}
