# Advisory architecture review by Claude on every PR (gate 4, advisory).
# Setup: in this repo run `claude`, then `/install-github-app` (adds the app and
# the ANTHROPIC_API_KEY secret). Delete this file if you don't want it.
name: claude-review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--max-turns 20'
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read docs/architecture/checklist.md and check the diff against every item.
            Post one PR comment with a table: item | PASS or FAIL | file:line | why.
            FAIL only with evidence from the diff. Skip style issues that lint already covers.
